<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Персональный подбор питания — Prime Kraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f1f1;--surface:#fff;--surface2:#f6f7f8;--border:#e4e6e9;--text:#1a1a1a;--muted:#7a828c;--accent:#ffcd00;--accent-dk:#ffad00;--ink:#141414;--cta:#141414;--ok:#12855f;--radius:16px;--maxw:520px;--head:64px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:50;background:var(--ink);height:var(--head);display:flex;align-items:center;justify-content:center}
.topbar .inner{width:100%;max-width:var(--maxw);display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar img{height:26px;filter:brightness(0) invert(1)}
.topbar .wm{color:#fff;font-weight:900;letter-spacing:1px;font-size:17px}
.topbar .tag{margin-left:auto;color:#c9cdd3;font-size:11px;font-weight:500}
.wrap{display:flex;justify-content:center;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px);min-height:calc(100vh - var(--head));min-height:calc(100dvh - var(--head))}
.wrap:has(.hero),.wrap:has(.insight),.wrap:has(.mathscr),.wrap:has(.milestone),.wrap:has(.loadscr){padding:0}
.app:has(.hero),.app:has(.insight),.app:has(.mathscr),.app:has(.milestone),.app:has(.loadscr){max-width:none}
@media(min-width:900px){.app:has(.rhead){max-width:820px}}
.app{width:100%;max-width:var(--maxw)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.screen{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{color:#111;font-weight:900;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 10px;display:inline-block;background:var(--accent);padding:4px 9px;border-radius:5px}
h1{font-size:26px;line-height:1.15;margin:0 0 12px;font-weight:900}
h2{font-size:20px;line-height:1.25;margin:0 0 6px;font-weight:900}
p.lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 18px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);color:#4b5563;font-size:12px;padding:6px 11px;border-radius:100px;margin:0 6px 8px 0;font-weight:500}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:active{transform:scale(.985)}
.btn-accent{background:var(--accent);color:var(--ink)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.progress{height:6px;background:#e6e8eb;border-radius:100px;overflow:hidden;margin-bottom:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-dk));border-radius:100px;transition:width .35s ease}
.deepnote{color:var(--muted);font-size:11px;margin:0 0 14px;text-align:center}
.deepnote b{color:#a8790a}
.qnum{color:var(--muted);font-size:13px;font-weight:700}
.hint{color:#5b6470;font-size:13px;line-height:1.4;margin:6px 0 16px;display:flex;gap:8px;background:#fffdf0;border:1px solid #f2e6a8;padding:10px 12px;border-radius:10px}
.hint::before{content:"";flex:0 0 auto;width:9px;height:9px;background:var(--yellow);transform:rotate(45deg);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:15px 16px;cursor:pointer;transition:.15s;font-size:15.5px;font-weight:600;text-align:left;color:var(--text);font-family:inherit;width:100%}
.opt:hover{border-color:#c9ccd1}
.opt.sel{border-color:var(--accent);background:#fffdf0;box-shadow:inset 0 0 0 1px var(--accent)}
.opt .mark{flex:0 0 20px;width:20px;height:20px;border:2px solid #d3d6da;border-radius:5px;position:relative;transition:.15s}
.opt.sel .mark{background:var(--yellow);border-color:var(--yellow)}
.opt.sel .mark::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #141414;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.bodygrid{display:flex;gap:12px}
.field{flex:1}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px;font-weight:500}
.field input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:20px;font-weight:700;padding:14px;font-family:inherit;text-align:center}
.field input:focus{outline:none;border-color:var(--accent)}
.nav{display:flex;gap:10px;margin-top:16px}
.skip{display:block;text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.loader{display:grid;place-items:center;gap:18px;padding:50px 0}
.ring{width:56px;height:56px;border-radius:50%;border:5px solid #e6e8eb;border-top-color:var(--accent-dk);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadtxt{color:var(--muted);font-size:14px;text-align:center;min-height:20px}
.analysis{background:var(--ink);color:#f3f4f6;border-radius:12px;padding:15px 16px;margin-bottom:14px;font-size:14px;line-height:1.55}
.analysis b{color:var(--accent)}
.captured{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{background:var(--surface2);border:1px solid var(--border);color:#4b5563;font-size:11px;padding:5px 10px;border-radius:100px;font-weight:500}
.prod{display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:11px;position:relative}
.prod .art{flex:0 0 74px;height:74px;border-radius:10px;background:#f4f5f6;display:grid;place-items:center;overflow:hidden}
.prod .art img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.prod .art.ph{font-family:var(--disp);font-style:italic;font-weight:900;color:#a8790a;background:#f6f7f8;font-size:30px;background:#eef0f2}
.prod .info{flex:1;min-width:0}
.prod .rolebadge{font-size:10px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#a8790a;margin-bottom:3px}
.prod .rolebadge.sup{color:var(--muted)}
.prod h3{margin:0 0 4px;font-size:14.5px;font-weight:700;line-height:1.2}
.prod .why{color:#4b5563;font-size:12.5px;line-height:1.45;margin:0 0 6px}
.prod .flav{color:var(--muted);font-size:11.5px;margin:0 0 8px}
.prod .flav b{color:var(--text)}
.prod .price{font-weight:900;font-size:15px}
.buys{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.buys a{flex:1;min-width:70px;text-align:center;text-decoration:none;font-size:12px;font-weight:800;padding:9px 6px;border-radius:9px;border:1.5px solid var(--border);color:var(--text);background:var(--surface)}
.buys a.site{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.repl{margin-top:8px;background:transparent;border:1.5px solid var(--border);color:#4b5563;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;cursor:pointer;font-family:inherit}
.repl:active{transform:scale(.97)}
.mini{color:var(--muted);font-style:italic}
.plan{background:#fffdf0;border:1px solid #f2e6a8;border-radius:12px;padding:14px 16px;margin:6px 0 14px}
.plan-h{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;color:#7a5c00}
.plan-row{display:flex;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid #f0e5a0;line-height:1.4}
.plan-row:nth-of-type(2){border-top:0}
.plan-row b{flex:0 0 118px;color:#111}
.plan-row span{color:#4b5563}
.rm{font-size:11px;font-weight:700;letter-spacing:.2px;position:absolute;top:9px;right:10px;background:none;border:0;color:#b6bcc4;font-size:17px;cursor:pointer;line-height:1}
.total{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px dashed #cfd3d8;border-radius:12px;padding:15px 16px;margin:4px 0 14px}
.total .sum{font-size:22px;font-weight:900}
.chat-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:100px;cursor:pointer}
.msg{font-size:13px;line-height:1.45;padding:10px 13px;border-radius:12px;margin-bottom:8px;max-width:88%}
.msg.bot{background:var(--surface2);border:1px solid var(--border)}
.msg.me{background:var(--accent);color:var(--ink);margin-left:auto;font-weight:600}
.save{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.save input[type=text]{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;color:var(--text);padding:13px;font-size:15px;font-family:inherit;margin-bottom:10px}
.save input:focus{outline:none;border-color:var(--accent)}
.consent{display:flex;gap:9px;align-items:flex-start;color:var(--muted);font-size:11.5px;line-height:1.4;margin:2px 0 12px;cursor:pointer}
.consent input{margin-top:2px}
.disc{color:#9aa0a8;font-size:11px;line-height:1.5;text-align:center;margin-top:18px;padding:0 6px}
.foot{color:#aab0b8;font-size:11px;text-align:center;margin-top:14px}
.saved{background:#e7f6ef;border:1px solid #a6dcc4;color:var(--ok);border-radius:12px;padding:14px;font-size:14px;font-weight:700;text-align:center}

/* ==== БРЕНД-СЛОЙ PRIME KRAFT (по primekraft.ru) ==== */
:root{--disp:"Roboto Condensed","Roboto",Arial,sans-serif;--yellow:#ffcd00;--carbon:#1c1c1c}
/* шапка как на сайте: карбон + жёлтая отбивка */
.topbar{border-bottom:3px solid var(--yellow);background:var(--carbon)}
.topbar .tag{background:none;border:0;padding:0;border-radius:0;text-transform:uppercase;letter-spacing:.9px;font-weight:900;font-size:10px;color:var(--yellow);font-family:var(--disp);font-style:italic}
/* фирменный наклонный капс в заголовках */
h1,h2,.total .sum{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.2px}
h1{font-size:32px;line-height:.98}
h2{font-size:23px;line-height:1.05}
.plan-h,.prod .rolebadge{font-family:var(--disp);font-style:italic}
.prod h3{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.1}
/* кнопки: рубленые углы, наклонный капс */
.btn{border-radius:4px;font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.6px;font-size:17px}
.btn-accent{background:var(--yellow);color:#111}
.btn-primary{background:var(--carbon)}
.buys a{border-radius:4px;font-family:var(--disp);font-style:italic;text-transform:uppercase;font-weight:900}
.kicker{border-radius:0;font-family:var(--disp);font-style:italic;font-weight:900;font-size:12px;letter-spacing:1px;padding:5px 10px}
.opt{border-radius:6px}
.opt.sel{box-shadow:inset 0 0 0 2px var(--yellow)}
.card{border-radius:8px}
.prod,.field input,.total,.plan,.chip,.msg,.save,.save input[type=text]{border-radius:6px}
/* ромб — графический элемент с баннеров */
.rhomb{position:absolute;width:54px;height:54px;background:var(--yellow);transform:rotate(45deg);pointer-events:none}
.rhomb::after{content:"";position:absolute;inset:38%;background:var(--carbon);transform:rotate(0)}
/* ==== ГЕРОЙ-ЭКРАН ==== */
.hero{position:relative;margin:0;width:100%;min-height:calc(100vh - var(--head));min-height:calc(100dvh - var(--head));display:flex;flex-direction:column;justify-content:flex-end;
  background:#0b0b0b linear-gradient(160deg,#2a2418,#0b0b0b 60%);overflow:hidden;isolation:isolate}
.hero .shot{position:absolute;inset:0;background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3F3KgyDYeiOSAVn7f4h8z7MUJVu/hf_20260810_122913_69de5cf1-21ef-423c-b01a-3e441cbf14e3.png");background-size:cover;background-position:52% 22%;z-index:-2}
.hero .veil{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(8,8,8,.97) 6%,rgba(8,8,8,.86) 26%,rgba(8,8,8,.30) 55%,rgba(8,8,8,.55) 100%)}
.hero .inner{width:100%;max-width:var(--maxw);margin:0 auto;padding:26px 20px calc(env(safe-area-inset-bottom) + 30px)}
.hero .kicker{background:var(--yellow);color:#111;margin-bottom:12px}
.hero h1{color:#fff;font-size:40px;line-height:.94;margin:0 0 12px;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hero h1 em{color:var(--yellow);font-style:italic;display:block}
.hero .lead{color:#d6d8dc;font-size:14.5px;line-height:1.45;margin:0 0 16px}
.hero .pills{margin-bottom:18px}
.hero .pill{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);color:#e8eaee;backdrop-filter:blur(3px)}
.hero .rhomb{top:26px;right:-14px;opacity:.95}
.hero .rhomb::after{background:#0e0e0e}
.hero .btn-accent{box-shadow:0 8px 26px rgba(255,205,0,.28)}
@media(max-width:380px){.hero h1{font-size:34px}.hero .lead{font-size:13.5px}}
@media(min-width:768px){.hero .shot{background-position:50% 26%}.hero h1{font-size:58px}.hero .lead{font-size:16px;max-width:470px}.hero .inner{padding-bottom:52px}}
@media(min-width:768px) and (min-height:900px){.hero .inner{padding-bottom:9vh}}


/* ==== ИМЯ ==== */
.namebox input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;padding:15px;font-family:inherit;text-align:center}
.namebox input:focus{outline:none;border-color:var(--yellow)}
/* ==== ВРЕЗКА-ИНСАЙТ ==== */
.insight{position:relative;width:100%;min-height:calc(100vh - var(--head));min-height:calc(100dvh - var(--head));display:flex;flex-direction:column;justify-content:flex-end;background:#0b0b0b;overflow:hidden;isolation:isolate}
.insight .shot{position:absolute;inset:0;background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3F3KgyDYeiOSAVn7f4h8z7MUJVu/hf_20260811_113208_1b181c57-5819-4fde-b05e-a4d5712d658a.png");background-size:cover;background-position:70% 40%;z-index:-2}
.insight .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(8,8,8,.97) 10%,rgba(8,8,8,.88) 34%,rgba(8,8,8,.42) 68%,rgba(8,8,8,.55) 100%)}
.insight .inner{width:100%;max-width:var(--maxw);margin:0 auto;padding:26px 20px calc(env(safe-area-inset-bottom) + 30px)}
.insight .kicker{background:var(--yellow);color:#111}
.insight h2{color:#fff;font-size:30px;line-height:1.06;margin:0 0 12px}
.insight p{color:#d6d8dc;font-size:15px;line-height:1.5;margin:0 0 20px}
.insight p b{color:var(--yellow)}
@media(min-width:768px){.insight h2{font-size:40px}}
/* ==== ЭКРАН РАСЧЁТА ==== */
.mathscr{position:relative;width:100%;min-height:calc(100vh - var(--head));min-height:calc(100dvh - var(--head));background:#0d0d0d;overflow:hidden;display:flex;align-items:center}
.mathscr .shaker{position:absolute;right:-4%;bottom:-4%;height:68%;max-width:34%;object-fit:contain;object-position:bottom right;opacity:.85;filter:drop-shadow(-26px 10px 40px rgba(0,0,0,.85)) drop-shadow(18px -12px 34px rgba(255,205,0,.16));pointer-events:none;z-index:0}
.mathscr .glow{position:absolute;left:-20%;top:-10%;width:70%;height:70%;background:radial-gradient(circle,rgba(255,205,0,.13),transparent 65%);pointer-events:none;z-index:0}
.mathscr .inner{position:relative;z-index:1;width:100%;max-width:var(--maxw);margin:0 auto;padding:28px 20px calc(env(safe-area-inset-bottom) + 28px)}
.mathscr h2{color:#fff;font-size:30px;line-height:1.06;margin:0 0 18px}
.kbju{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.12)}
.kb{display:flex;flex-direction:column;gap:3px}
.kbv{font-family:var(--disp);font-style:italic;font-weight:900;font-size:22px;color:#fff;line-height:1}
.kb:first-child .kbv{color:var(--yellow)}
.kbl{font-size:11px;color:#9aa0a8;letter-spacing:.2px}
@media(min-width:768px){.kbv{font-size:28px}.kbl{font-size:12px}}
.calcrow{border-top:1px solid rgba(255,255,255,.12);padding:14px 0}
.calcrow:first-of-type{border-top:0}
.calcrow .big{font-family:var(--disp);font-style:italic;font-weight:900;font-size:38px;line-height:1;color:#fff;letter-spacing:-.5px}
.calcrow.gap .big{color:var(--yellow)}
.calcrow .cap{color:#b9bec6;font-size:13.5px;line-height:1.45;margin-top:6px;max-width:300px}
.mathscr .foot2{color:#8f959d;font-size:13px;margin:16px 0 18px;max-width:320px}
@media(min-width:768px){.mathscr h2{font-size:40px}.calcrow .big{font-size:46px}.mathscr .shaker{right:4%;height:80%;max-width:30%}}
@media(max-width:520px){.mathscr .shaker{opacity:.3;right:-10%;height:56%;max-width:52%}}
/* ==== СРАВНЕНИЕ ==== */
.cmp{background:var(--ink);border-radius:8px;overflow:hidden;margin:18px 0}
.cmp .ch{display:grid;grid-template-columns:1fr 1fr}
.cmp .col{padding:16px 15px}
.cmp .col.usual{background:rgba(255,255,255,.04)}
.cmp .ct{font-family:var(--disp);font-style:italic;font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.5px;margin-bottom:10px}
.cmp .col.usual .ct{color:#8f959d}
.cmp .col.ours .ct{color:var(--yellow)}
.cmp li{list-style:none;color:#e8eaee;font-size:13px;line-height:1.35;margin-bottom:9px;padding-left:12px;position:relative}
.cmp li::before{content:"";position:absolute;left:0;top:5px;width:5px;height:5px;background:var(--yellow);transform:rotate(45deg)}
.cmp .col.usual li{color:#9aa0a8}
.cmp .col.usual li::before{background:#565b62}
.cmp ul{margin:0;padding:0}
.cmp .note{padding:13px 15px;border-top:1px solid rgba(255,255,255,.1);color:#b9bec6;font-size:12.5px;line-height:1.45}


/* ==== ЛЕНДИНГ ==== */
.facts{display:grid;grid-template-columns:1fr;gap:1px;background:#dcdee1;border:1px solid #dcdee1;border-radius:8px;overflow:hidden}
.fact{background:var(--bg);padding:14px 15px 14px 32px;position:relative}
.fact::before{content:"";position:absolute;left:15px;top:19px;width:6px;height:6px;background:var(--yellow);transform:rotate(45deg)}
.fact b{display:block;font-size:14.5px;line-height:1.25;margin-bottom:4px;color:var(--text)}
.fact span{display:block;font-size:12.5px;line-height:1.4;color:var(--muted)}
@media(min-width:600px){.facts{grid-template-columns:1fr 1fr}}
.sec{position:relative;width:100%;overflow:hidden}
.sec .in{width:100%;max-width:var(--maxw);margin:0 auto;padding:52px 20px}
.sec.dark{background:#0d0d0d;color:#fff}
.sec.light{background:#f1f1f1;color:var(--text)}
.sec .shot{position:absolute;inset:0;background-size:cover;z-index:0}
.sec .veil{position:absolute;inset:0;z-index:1}
.sec .in{position:relative;z-index:2}
.sec h2{font-size:28px;line-height:1.06;margin:0 0 8px}
.sec.dark h2{color:#fff}
.sec .sub{font-size:14.5px;line-height:1.5;margin:0 0 26px}
.sec.dark .sub{color:#b9bec6}
.sec.light .sub{color:var(--muted)}
.step{display:flex;gap:15px;padding:16px 0;border-top:1px solid rgba(255,255,255,.12)}
.sec.light .step{border-color:#dcdee1}
.step:first-of-type{border-top:0}
.step .no{font-family:var(--disp);font-style:italic;font-weight:900;font-size:26px;line-height:1;color:var(--yellow);flex:0 0 42px}
.step b{display:block;font-size:16px;margin-bottom:5px}
.step p{margin:0;font-size:13.5px;line-height:1.5;color:#b9bec6}
.sec.light .step p{color:#5b6470}
.ben{padding:15px 0;border-top:1px solid rgba(255,255,255,.12)}
.ben:first-of-type{border-top:0}

function mathData(P){
  const norm=proteinNorm(P); if(!norm||!P.weight)return null;
  const perMeal={'12':2,'3':3,'45':4.5}[P.meals]||3;
  const q={high:32,mid:26,low:18}[P.diet_protein]||24;
  let food=Math.round(perMeal*q/5)*5;
  food=Math.min(food,Math.round(norm*0.85/5)*5);
  const gap=Math.max(0,norm-food);
  const port=Math.max(1,Math.min(4,Math.round(gap/25)));
  const water=Math.min(4,(P.weight*0.03+((P.freq==='5'||P.freq==='3_4')?0.5:0))).toFixed(1).replace('.',',');
  const meal={'12':'один-два раза в день','3':'три раза в день','45':'четыре-пять раз в день'}[P.meals]||'как получается';
  const age={u25:22,'25_35':30,'35_45':40,o45:50}[P.age]||30;
  const h=P.height||(P.sex==='f'?165:178);
  const bmr=10*P.weight+6.25*h-5*age+(P.sex==='f'?-161:5);
  const act={'0':1.3,'1_2':1.4,'3_4':1.55,'5':1.7}[P.freq]||1.4;
  const gk={slim:0.82,mass:1.12,strength:1.05,health:1}[P.goal]||1;
  const kcal=Math.round(bmr*act*gk/10)*10;
  const fat=Math.round(P.weight*(P.goal==='slim'?0.9:1.0));
  const carb=Math.max(60,Math.round((kcal-norm*4-fat*9)/4));
  return {norm,food,gap,port,water,meal,kcal,fat,carb};
}

function doseOf(id,it){
  const g=parseInt(String(it.size||'').replace(/\s/g,''))||0;
  const caps=/капс|таб|шт/i.test(it.size||it.n||'')?g:0;
  const M={whey:30,plant:30,casein:30,gainer:100,creatine:5,bcaa:10,citrulline:6,preworkout:12,bar:60,cookie:40,isotonic:20};
  if(M[id]&&g&&!caps)return {perDay:M[id],days:Math.floor(g/M[id]),unit:'г'};
  if(caps)return {perDay:2,days:Math.floor(caps/2),unit:'капс'};
  return null;
}
function econBlock(picks,sum){
  let minDays=99, ok=0;
  picks.forEach(x=>{const d=doseOf(x.id,itemOf(x.id)); if(d&&d.days){ok++; if(d.days<minDays)minDays=d.days;}});
  if(!ok)return '';
  const days=Math.max(15,Math.min(60,minDays));
  const perDay=Math.round(sum/days);
  return `<div class="econ">
    <div class="ec"><b>${days} дн.</b><span>на столько хватит набора</span></div>
    <div class="ec"><b>${perDay} ₽</b><span>в день на всём наборе</span></div>
    <div class="ec"><b>${picks.length}</b><span>продукта под вашу задачу</span></div>
  </div>`;
}

async function replaceItem(origId){

  const picks=currentPicks();const setIds=picks.map(p=>p.id);const curId=swaps[origId]||origId;
  const stimBlocked=(P.health||[]).includes('hyper')||(P.health||[]).includes('preg');

  if(stimBlocked)cand=cand.filter(c=>!['preworkout'].includes(c));
  const candidates=cand.map(c=>({id:c,name:itemOf(c).n,cat:CAT[c].c}));
  if(!candidates.length)return;

      const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'replace',profile:P,current:{id:curId,name:cur.n,cat:cur.c},set:setIds,candidates})});

    }catch(e){}
  }

function pickVariant(list){
  if(!Array.isArray(list)||!list.length)return null;
  const avail=list.filter(x=>x.available);
  const pool=avail.length?avail:list;
  if(P&&P.flavor){const m=pool.filter(x=>x.flav===P.flavor);if(m.length)return m[0];}
  if(P&&P.restrictions==='vegan'){const v=pool.filter(x=>(x.tags||[]).includes('vegan'));if(v.length)return v[0];}
  if(P&&P.sweet==='yes'){const sf=pool.filter(x=>(x.tags||[]).includes('sugarfree'));if(sf.length)return sf[0];}
  return pool[0];
}

function itemOf(id){
  const c=CAT[id];if(!c)return c;

  if(!v)return c;
  return Object.assign({},c,{
    n:v.name||c.n, price:v.price||c.price, old:v.oldprice||c.old,
    img:v.img||c.img, url:c.url, available:v.available,
    flavName:v.flavName||'', size:v.size||'', tags:v.tags||[], variants:c.variants
  });
}

    for(const k in bt){
      if(!CAT[k])continue;
      const list=Array.isArray(bt[k])?bt[k]:[bt[k]];   // совместимость со старым форматом
      if(!list.length)continue;
      CAT[k].variants=list;CAT[k].real=true;
      const best=list[0];
      if(best.name)CAT[k].n=best.name;
      if(best.price)CAT[k].price=best.price;
      if(best.oldprice)CAT[k].old=best.oldprice;
      if(best.img)CAT[k].img=best.img;
      if(best.url)CAT[k].url=best.url;
      CAT[k].available=best.available;
    }
  }catch(e){}
}
loadCatalog();
start();
</script>
